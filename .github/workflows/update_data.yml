name: Update Stock Data

on:
  schedule:
    # 平日 日本時間 11:30 (前場引け) = UTC 02:30
    - cron: '30 2 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests xlrd openpyxl

      - name: Update stock universe (TSE Prime list)
        run: python src/fetch_universe.py

      - name: Update stock data
        run: python src/update_stocks.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json data/universe_prime.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update stock data ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              echo "Push failed after $attempt attempts."
              exit 1
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest remote branch..."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              # data/stocks.json と data/universe_prime.json は毎回完全に
              # 再生成される機械生成ファイルなので、テキストの3-wayマージは
              # 意味を持たない。コンフリクトした場合は今回新しく計算した
              # 内容（rebase中のtheirs）をそのまま採用する。
              echo "Rebase conflict on generated data files; keeping this run's freshly computed data."
              git checkout --theirs -- data/stocks.json data/universe_prime.json 2>/dev/null || true
              git add data/stocks.json data/universe_prime.json
              if ! git rebase --continue; then
                echo "Could not resolve rebase automatically."
                git rebase --abort
                exit 1
              fi
            fi
            sleep $((attempt * 3))
          done
